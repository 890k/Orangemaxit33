        .menu-icon {

            cursor: pointer;

            font-weight: 800;
            line-height: 1.25;

        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--slider-track);
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 22px;

            border-radius: 50%;

            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);

        input[type=range]::-moz-range-track {

            height: 6px;

            background: var(--slider-track);
            border-radius: 3px;
        }

        input[type=range]::-moz-range-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--orange-primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

            font-weight: 700;

            font-size: 13px;
            color: #888888;
        }
